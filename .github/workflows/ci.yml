name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party actions are pinned to commits: they run in the job that
      # builds the release exe. Dependabot updates the pins.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --target ${{ env.TARGET }} --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --target ${{ env.TARGET }} --locked

      - name: Build release
        run: cargo build --release --target ${{ env.TARGET }} --locked

      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: widepeek-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/widepeek.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: widepeek-${{ env.TARGET }}
          path: dist

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum widepeek.exe > widepeek.exe.sha256
          notes="This exe is not signed. Windows SmartScreen or an antivirus can show a warning. Compare the SHA-256 with widepeek.exe.sha256 and, if you want, scan the exe on [VirusTotal](https://www.virustotal.com)."
          gh release create "$GITHUB_REF_NAME" widepeek.exe widepeek.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "widepeek $GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes
